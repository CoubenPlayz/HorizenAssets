/* ---- Horizen glow theme ---- */
:root{--bg:#070a14;--panel:rgba(22,30,58,.62);--line:rgba(130,150,255,.16);--ac:#7c8cff;--ac2:#b46bff;--grad:linear-gradient(135deg,#6ea8ff,#7c5cff 55%,#c05bff)}

/* ---------- OAuth provider: "Log in with HorizenMessages" consent page (/oauth/consent) ---------- */
let consenting=false;
const SCOPE_INFO={email:['Email address','Read your email address'],profile:['Profile','Read your name and profile picture'],openid:['Identity','Confirm who you are'],phone:['Phone number','Read your phone number']};
const CHECK='<svg width="16" height="16" viewBox="0 0 16 16"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>';
async function consentPage(){
  document.body.classList.add('ghx');
  const h1=$('auth').querySelector('h1');if(h1)h1.textContent='Sign in to HorizenMessages';
  if(consenting)return;consenting=true;
  const plain=(h,m)=>{$('auth').hidden=true;$('app').hidden=true;$('consent').hidden=true;$('done').hidden=false;$('dh').textContent=h;$('dm').textContent=m;$('go').hidden=true;$('deny').hidden=true};
  const id=new URLSearchParams(location.search).get('authorization_id')||sessionStorage.getItem('oauth_aid');
  if(!id){consenting=false;return plain('Missing sign-in request','Start again from the app you came from.')}
  sessionStorage.setItem('oauth_aid',id);
  const {data:{session}}=await sb.auth.getSession();
  if(!session){consenting=false;$('app').hidden=true;$('done').hidden=true;$('consent').hidden=true;$('auth').hidden=false;return note('Sign in to continue to the app you came from.')}
  await ensureAccount(session.user);
  if(!(await approved(session.user))){consenting=false;return plain('Confirm your email first','Open the link in your confirmation email, then try again.')}
  const {data:d,error}=await sb.auth.oauth.getAuthorizationDetails(id);
  if(error||!d){sessionStorage.removeItem('oauth_aid');return plain('Sign-in request expired',error?.message||'Start again from the app.')}
  if(!('authorization_id' in d)){sessionStorage.removeItem('oauth_aid');return location.replace(d.redirect_url)}
  const u=session.user,name=d.client.name||'This app';
  const {data:pf}=await sb.from('profiles').select('username').eq('id',u.id).maybeSingle();
  const uname=(pf&&pf.username)||u.email;
  const av=(box,url,txt)=>{box.textContent='';if(url&&/^https:\/\//.test(url)){const im=new Image();im.alt='';im.src=url;im.onerror=()=>{box.textContent=txt};box.appendChild(im)}else box.textContent=txt};
  av($('oc-a'),d.client.logo_uri,name[0].toUpperCase());
  av($('oc-b'),(u.user_metadata||{}).avatar_url,String(uname)[0].toUpperCase());
  $('oc-t').textContent='Authorize '+name;
  $('oc-s').innerHTML='<b>'+esc(name)+'</b> wants to access your <b>'+esc(uname)+'</b> HorizenMessages account.';
  const scopes=(d.scope||'email').split(' ').filter(Boolean);
  $('oc-l').innerHTML=scopes.map(x=>{const i=SCOPE_INFO[x]||[x,'Access to '+x];return '<li>'+CHECK+'<div><b>'+esc(i[0])+'</b><span>'+esc(i[1])+'</span></div></li>'}).join('');
  let host=d.redirect_uri;try{host=new URL(d.redirect_uri).origin}catch(e){}
  $('oc-r').innerHTML='Authorizing will redirect to<br><b>'+esc(host)+'</b>';
  $('oc-u').hidden=true;
  sb.rpc('oauth_app_users',{cid:d.client.id}).then(({data:n,error:e})=>{n=Number(n);if(!e&&n>0){$('oc-u').innerHTML='<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3 3-5 6-5s6 2 6 5z"/></svg><span>Used by <b>'+n.toLocaleString()+'</b> HorizenMessages user'+(n===1?'':'s')+'</span>';$('oc-u').hidden=false}});
  $('oc-f').innerHTML='Signed in as <b>'+esc(u.email||uname)+'</b> · <a id="oc-so">Not you? Sign out</a>';
  $('oc-so').onclick=()=>sb.auth.signOut();
  $('auth').hidden=true;$('app').hidden=true;$('done').hidden=true;$('consent').hidden=false;
  const decide=async ok=>{
    $('oc-ok').disabled=$('oc-no').disabled=true;
    const r=ok?await sb.auth.oauth.approveAuthorization(id):await sb.auth.oauth.denyAuthorization(id);
    sessionStorage.removeItem('oauth_aid');
    if(r.error)return plain('Something went wrong',r.error.message);
    location.replace(r.data.redirect_url);
  };
  $('oc-ok').onclick=()=>decide(true);$('oc-no').onclick=()=>decide(false);
}
async function confirmPage(){
  $('auth').hidden=true;$('app').hidden=true;$('done').hidden=false;
  const say=(h,m)=>{$('dh').textContent=h;$('dm').textContent=m};
  if(localStorage.getItem('email')!=='confirmation')return say('Can\u2019t confirm here','Open this link in the same browser you signed up with.');
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return say('Link not verified','Try the link in your email again.');
  const u=session.user,{error}=await sb.from('approved_acounts').upsert({user_id:u.id,email:u.email});
  if(error)return say('Activation failed',error.message);
  localStorage.removeItem('email');say('Email confirmed','Your account is activated.');$('go').hidden=false;
}
async function boot(){
  if(location.pathname.includes('email-confirmation'))return confirmPage();
  if(location.pathname.includes('oauth/consent'))return consentPage();
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('app').hidden=true;$('auth').hidden=false;return}
  await ensureAccount(session.user);
  if(await approved(session.user))start(session.user);
  else{await sb.auth.signOut({scope:'local'});$('app').hidden=true;$('auth').hidden=false;note('Your account isn\u2019t confirmed yet. Check your email for the link.')}
}
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'){location.reload()}else if(e==='SIGNED_IN'&&s&&!started&&!window.holdBoot&&!location.pathname.includes('email-confirmation'))boot()});
boot();

async function start(u){
  if(started)return;started=true;me=u;
  $('auth').hidden=true;$('app').hidden=false;
  await loadProfiles();$('who').textContent=P[me.id]?.username||'Me';paintSet();document.addEventListener('click',()=>{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(paintSet)},{once:true});
  await Promise.all([loadConvs(),loadFriends()]);
  sb.channel('db')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{if(p.new.conversation_id===cur)addMsg(p.new);notifyMsg(p.new)})
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},p=>{if(p.new.conversation_id===cur)addMsg(p.new)})
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},async()=>{await loadProfiles();loadConvs();loadFriends();paintSet()})
   .on('postgres_changes',{event:'*',schema:'public',table:'reactions'},()=>{if(cur)loadReacts()})
   .on('postgres_changes',{event:'*',schema:'public',table:'friendships'},loadFriends)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'conversation_members'},async p=>{await loadConvs();onAdded(p.new)}).subscribe();
  sb.channel('u:'+me.id).on('broadcast',{event:'sig'},({payload})=>onSig(payload)).subscribe();
  const pr=sb.channel('online',{config:{presence:{key:me.id}}});
  pr.on('presence',{event:'sync'},()=>{online=new Set(Object.keys(pr.presenceState()));paint()}).subscribe(st=>{if(st==='SUBSCRIBED')pr.track({at:Date.now()})});
  // Opened from Horizen OS: #sig=<incoming call>, #chat=<conversation id>
  const hs=location.hash;history.replaceState(null,'',location.pathname+location.search);
  const hm=hs.match(/^#sig=(.+)$/),hc=hs.match(/^#chat=([\w-]+)$/);
  if(hm){try{const w=JSON.parse(atob(decodeURIComponent(hm[1])));if(Date.now()-w.at<45000)onSig(w.p)}catch(e){}}
  else if(hc&&convs.find(c=>c.id===hc[1]))openConv(hc[1]);
}

const uname=id=>P[id]?.username||'Unknown';

  await loadProfiles();

  $('fl').innerHTML=fr.map(f=>{
    const other=f.requester===me.id?f.addressee:f.requester;
    if(f.status==='accepted')return `<div class="row" style="${av(other)}"><span>${esc(uname(other))}</span><button data-dm="${other}">Message</button></div>`;
    if(f.addressee===me.id)return `<div class="row"><span>${esc(uname(other))} wants to be friends</span><button data-ok="${f.id}">Accept</button></div>`;
    return `<div class="row"><span>${esc(uname(other))}</span><span class="mut">Request sent</span></div>`;

/* ---------- Conversations ---------- */
async function loadConvs(){
  const {data}=await sb.from('conversations').select('*,conversation_members(user_id)').order('created_at',{ascending:false});
  convs=data||[];
  $('chats').innerHTML='<div class="pad"><button class="g" id="ng">New group</button></div>'+
    (convs.map(c=>`<div class="row ${c.id===cur?'on':''}" data-c="${c.id}" style="${c.is_group?'':av(other(c))}"><span>${esc(cname(c))}</span>${c.is_group?'<small class="mut">Group</small>':''}</div>`).join('')||'<div class="pad mut">No chats yet.</div>');
  $('ng').onclick=newGroup;paint();
}
const other=c=>c.conversation_members.map(m=>m.user_id).find(i=>i!==me.id);
const cname=c=>c.is_group?c.name:uname(other(c));
$('chats').onclick=e=>{const r=e.target.closest('[data-c]');if(r)openConv(r.dataset.c)};

async function mk(name,isGroup,ids){
  const {data:c,error}=await sb.from('conversations').insert({name,is_group:isGroup,created_by:me.id}).select().single();
  if(error)return alert(error.message);
  const {error:e2}=await sb.from('conversation_members').insert([me.id,...ids].map(user_id=>({conversation_id:c.id,user_id})));
  if(e2)return alert(e2.message);
  await loadConvs();return c.id;
}
async function openDM(fid){
  let c=convs.find(c=>!c.is_group&&other(c)===fid);
  openConv(c?c.id:await mk(null,false,[fid]));tab(1);
}
async function newGroup(){
  const name=prompt('Group name');if(!name)return;
  const names=(prompt('Friends to add (usernames, comma separated)')||'').split(',').map(s=>s.trim().toLowerCase());
  const ids=fr.filter(f=>f.status==='accepted').map(f=>f.requester===me.id?f.addressee:f.requester).filter(i=>names.includes(uname(i).toLowerCase()));
  if(!ids.length)return alert('Add at least one friend you are already connected with.');
  openConv(await mk(name,true,ids));
}

/* ---------- Messages ---------- */
let M={},R={},online=new Set(),tch,lastT=0,tmr,typing=false,rep=null,edit=null;
const EM=['👍','❤️','😂','😮','😢'];

function bar(){

  r.innerHTML=(edit?'Editing message':rep?'Replying to '+esc(uname(rep.sender_id)):'')+' <button type="button" class="g" id="rx">✕</button>';

async function loadReacts(){
  const ids=Object.keys(M);R={};
  if(ids.length){const {data}=await sb.from('reactions').select('*').in('message_id',ids);(data||[]).forEach(r=>(R[r.message_id]=R[r.message_id]||[]).push(r))}
  Object.values(M).forEach(addMsg);
}
async function openConv(id){
  cur=id;const c=convs.find(c=>c.id===id);rep=edit=null;typing=false;bar();
  $('app').classList.add('open');$('head').hidden=false;$('send').hidden=false;
  $('cn').textContent=cname(c);$('ca').hidden=$('cv').hidden=c.is_group;$('ad').hidden=!c.is_group;
  document.querySelectorAll('#chats .row').forEach(r=>r.classList.toggle('on',r.dataset.c===id));
  if(tch)sb.removeChannel(tch);
  tch=sb.channel('typing:'+id);
  tch.on('broadcast',{event:'t'},({payload})=>{if(payload.u===me.id)return;typing=true;status();clearTimeout(tmr);tmr=setTimeout(()=>{typing=false;status()},2500)}).subscribe();
  const {data}=await sb.from('messages').select('*').eq('conversation_id',id).order('created_at');
  M={};R={};$('msgs').innerHTML='';(data||[]).forEach(m=>M[m.id]=m);
  const ids=Object.keys(M);
  if(ids.length){const {data:rx}=await sb.from('reactions').select('*').in('message_id',ids);(rx||[]).forEach(r=>(R[r.message_id]=R[r.message_id]||[]).push(r))}
  (data||[]).forEach(addMsg);status();
}
function addMsg(m){
  M[m.id]=m;let d=document.querySelector(`[data-id="${m.id}"]`);const n=!d;
  if(n){d=document.createElement('div');d.dataset.id=m.id}
  d.className='m'+(m.sender_id===me.id?' me':'');
  const q=m.reply_to&&M[m.reply_to],rs={};(R[m.id]||[]).forEach(r=>(rs[r.emoji]=rs[r.emoji]||[]).push(r.user_id));
  let h=`<small>${esc(uname(m.sender_id))} · ${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${m.edited?' · edited':''}</small>`;
  if(q)h+=`<div class="q">${esc(uname(q.sender_id))}: ${esc(q.deleted?'Deleted message':pretty(q.body)||q.file_name||'File')}</div>`;
  if(m.deleted)h+='<i class="mut">Message deleted</i>';
  else{
    if(m.file_url&&/^https:\/\//.test(m.file_url))h+=/^image\//.test(m.file_type||'')?`<a href="${esc(m.file_url)}" target="_blank" rel="noopener"><img src="${esc(m.file_url)}" alt=""></a>`:`<a class="fl" href="${esc(m.file_url)}" target="_blank" rel="noopener">📎 ${esc(m.file_name||'File')}</a>`;
    const pm=m.body&&m.body.match(/^::party::([a-z0-9]{3,32})::(.*)$/);
    if(pm)h+=`<div class="pty"><b>🎮 ${esc(pm[2])}</b><span>Eaglercraft party · code ${pm[1]}</span><div><button data-a="play" data-c="${pm[1]}">Play here</button><button class="g" data-a="tab" data-c="${pm[1]}">New tab</button></div></div>`;
    else if(m.body&&/^::game::/.test(m.body)){const g=m.body.match(/^::game::(\S+?)::(.*)$/),u=g&&gameUrl(g[1]);
      h+=u?`<div class="pty"><b>🕹️ ${esc(g[2])}</b><span>${esc(new URL(u).host)}</span><div><button data-a="game" data-r="${esc(g[1])}" data-t="${esc(g[2])}">Play here</button><button class="g" data-a="gtab" data-r="${esc(g[1])}">New tab</button></div></div>`:`<div>${esc(m.body)}</div>`}
    else if(m.body)h+=`<div>${esc(m.body)}</div>`;
    h+='<button class="mb" data-a="menu" aria-label="Message actions">⋯</button>';
  }
  const k=Object.keys(rs);
  if(k.length)h+='<div class="rx">'+k.map(e=>`<span data-a="re" data-e="${e}" class="${rs[e].includes(me.id)?'mine':''}">${e} ${rs[e].length}</span>`).join('')+'</div>';
  d.innerHTML=h;if(n){$('msgs').append(d);$('msgs').scrollTop=1e9}
}
async function react(id,e){
  const x=(R[id]||[]).find(r=>r.user_id===me.id&&r.emoji===e);
  if(x)await sb.from('reactions').delete().match({message_id:id,user_id:me.id,emoji:e});
  else await sb.from('reactions').insert({message_id:id,user_id:me.id,emoji:e});
  loadReacts();
}
$('msgs').onclick=e=>{
  const t=e.target.closest('[data-a]'),d=e.target.closest('[data-id]');
  document.querySelectorAll('.pop').forEach(p=>p.remove());
  if(!t||!d)return;const m=M[d.dataset.id];
  if(t.dataset.a==='re')return react(m.id,t.dataset.e);
  if(t.dataset.a==='play')return playParty(t.dataset.c);
  if(t.dataset.a==='tab')return void window.open(partyUrl(t.dataset.c),'_blank','noopener');
  if(t.dataset.a==='game')return playGame(t.dataset.r,t.dataset.t);
  if(t.dataset.a==='gtab'){const u=gameUrl(t.dataset.r);return void(u&&window.open(u,'_blank','noopener'))}
  const p=document.createElement('div');p.className='pop';
  p.innerHTML=EM.map(x=>`<span data-p="${x}">${x}</span>`).join('')+'<button class="g" data-p="reply">Reply</button>'+(m.sender_id===me.id?(m.body&&!/^::(party|game)::/.test(m.body)?'<button class="g" data-p="edit">Edit</button>':'')+'<button class="g" data-p="del">Delete</button>':'');
  p.onclick=async ev=>{
    const a=ev.target.dataset.p;if(!a)return;p.remove();
    if(EM.includes(a))react(m.id,a);
    else if(a==='reply'){rep=m;edit=null;bar();$('mi').focus()}
    else if(a==='edit'){edit=m;rep=null;bar();$('mi').value=m.body;$('mi').focus()}
    else if(a==='del'){const {error}=await sb.from('messages').update({deleted:true,body:null,file_url:null}).eq('id',m.id);if(error)alert(error.message)}
  };
  d.append(p);
};
$('send').onsubmit=async e=>{
  e.preventDefault();const body=$('mi').value.trim();if(!body||!cur)return;$('mi').value='';
  if(edit){const id=edit.id;edit=null;bar();const {error}=await sb.from('messages').update({body,edited:true}).eq('id',id);if(error)alert(error.message);return}
  if(await eagler(body)||await gameCmd(body))return;
  const row={conversation_id:cur,sender_id:me.id,body};if(rep)row.reply_to=rep.id;rep=null;bar();
  const {error}=await sb.from('messages').insert(row);if(error)alert(error.message);
};
$('mi').oninput=()=>{if(tch&&Date.now()-lastT>1500){lastT=Date.now();tch.send({type:'broadcast',event:'t',payload:{u:me.id}})}};
$('at').onclick=()=>$('fi').click();
$('fi').onchange=async()=>{
  const f=$('fi').files[0];$('fi').value='';if(!f||!cur)return;
  if(f.size>10e6)return alert('Files can be up to 10 MB.');

  const {error}=await sb.storage.from('chat-files').upload(path,f);if(error)return alert(error.message);
  const {data}=sb.storage.from('chat-files').getPublicUrl(path);

  if(rep){row.reply_to=rep.id;rep=null;bar()}$('mi').value='';
  const {error:e2}=await sb.from('messages').insert(row);if(e2)alert(e2.message);
};

/* ---------- Calls: WebRTC signaled over Supabase Realtime broadcast ---------- */
let pc,stream,peer,pend=[],chans={},inc=null,ring;
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]};
// wait until the channel is really joined before sending, so offers and ICE are never lost
const sch=id=>chans[id]||(chans[id]=new Promise((res,rej)=>{const c=sb.channel('u:'+id);
  c.subscribe(st=>{if(st==='SUBSCRIBED')res(c);else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(st)){delete chans[id];sb.removeChannel(c);rej(new Error(st))}})}));
// send with one retry on a fresh channel; returns true when delivered to the server
async function sig(to,p){
  for(let i=0;i<2;i++){
    try{
      const c=await Promise.race([sch(to),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),6000))]);
      if(await c.send({type:'broadcast',event:'sig',payload:{...p,from:me.id}})==='ok')return true;
    }catch(e){}
    const old=chans[to];delete chans[to];if(old)old.then(c=>sb.removeChannel(c)).catch(()=>{});
  }
  return false;
}
// wait for ICE gathering so the whole offer/answer goes in ONE message (no trickle, no rate limits)
const gathered=()=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();
  const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};
  pc.addEventListener('icegatheringstatechange',f);setTimeout(r,2500)});
async function setup(video){
  stream=await navigator.mediaDevices.getUserMedia({audio:true,video});
  $('lv').srcObject=stream;$('lv').hidden=!video;
  pc=new RTCPeerConnection(ICE);
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack=e=>{$('rv').srcObject=e.streams[0];$('rv').play().catch(()=>{})};
  pc.onconnectionstatechange=()=>{const s=pc&&pc.connectionState;
    if(s==='connected'){clearTimeout(ring);$('cs').textContent='Connected'}
    if(s==='failed')$('cs').textContent='Connection failed. Your network may block calls.';
    if(s==='disconnected')$('cs').textContent='Reconnecting…'};
  $('call').hidden=false;$('cs').textContent='Calling '+uname(peer)+'…';$('mu').textContent='Mute';
}
async function startCall(video){
  const c=convs.find(c=>c.id===cur);if(!c||c.is_group)return;
  if(pc&&pc.connectionState==='connected')return;
  if(inc){sig(inc.from,{t:'end'});inc=null;$('inc').hidden=true}
  if(pc)hang(true);
  peer=other(c);
  try{await setup(video)}catch(e){hang(false);return alert('Allow microphone'+(video?' and camera':'')+' access to call.')}
  const o=await pc.createOffer();await pc.setLocalDescription(o);await gathered();
  if(!pc)return;
  if(!(await sig(peer,{t:'offer',sdp:pc.localDescription,video}))){hang(false);return alert('Couldn’t reach the call server. Check your connection and try again.')}
  ring=setTimeout(()=>{if(pc&&pc.connectionState!=='connected'){hang(true);alert('No answer.')}},45000);
}
$('ca').onclick=()=>startCall(false);$('cv').onclick=()=>startCall(true);
async function flush(){for(const c of pend)await pc.addIceCandidate(c).catch(()=>{});pend=[]}
async function onSig(p){
  if(p.t==='offer'){
    if(inc&&inc.from===p.from)inc=null;
    if(pc&&pc.connectionState!=='connected'&&p.from===peer)hang(false);
    if(pc||inc)return sig(p.from,{t:'busy'});
    inc=p;p.x=setTimeout(()=>{if(inc===p){inc=null;$('inc').hidden=true}},50000);ping(uname(p.from),p.video?'Incoming video call':'Incoming voice call','call');$('in').textContent=uname(p.from);$('it').textContent=p.video?'Incoming video call':'Incoming voice call';$('inc').hidden=false;
  }else if(p.t==='answer'&&pc&&p.from===peer){await pc.setRemoteDescription(p.sdp);await flush()}
  else if(p.t==='ice'){pc&&pc.remoteDescription?pc.addIceCandidate(p.c).catch(()=>{}):pend.push(p.c)}
  else if(p.t==='end'&&inc&&p.from===inc.from){inc=null;pend=[];$('inc').hidden=true}
  else if((p.t==='end'||p.t==='busy')&&pc&&p.from===peer){if(p.t==='busy')alert('They are on another call.');hang(false)}
}
$('ac').onclick=async()=>{
  const p=inc;inc=null;$('inc').hidden=true;peer=p.from;
  try{await setup(p.video)}catch(e){hang(true);return alert('Allow microphone'+(p.video?' and camera':'')+' access to answer.')}
  await pc.setRemoteDescription(p.sdp);await flush();
  const a=await pc.createAnswer();await pc.setLocalDescription(a);await gathered();
  if(!pc)return;if(!(await sig(peer,{t:'answer',sdp:pc.localDescription}))){hang(false);alert('Couldn’t reach them. Try again.')}
};
$('dc').onclick=()=>{sig(inc.from,{t:'end'});inc=null;pend=[];$('inc').hidden=true};
$('mu').onclick=()=>{const t=stream&&stream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mu').textContent=t.enabled?'Mute':'Unmute'}};
function hang(notify){
  clearTimeout(ring);if(notify&&peer)sig(peer,{t:'end'});
  stream&&stream.getTracks().forEach(t=>t.stop());pc&&pc.close();
  pc=stream=peer=null;pend=[];$('call').hidden=true;$('rv').srcObject=$('lv').srcObject=null;
}

let unread=0;const base=document.title;
const away=()=>document.hidden||!document.hasFocus();
const seenTab=()=>{unread=0;document.title=base};
addEventListener('focus',seenTab);document.addEventListener('visibilitychange',()=>{if(!document.hidden)seenTab()});
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,4000)}

const EG_ALPHA='abcdefghjkmnpqrstuvwxyz23456789';

const pretty=b=>{const m=b&&b.match(/^::party::([a-z0-9]{3,32})::(.*)$/),g=b&&b.match(/^::game::(\S+?)::(.*)$/);return m?'🎮 Party: '+m[2]:g?'🕹️ '+g[2]:b};
function egServer(v){let s=v.trim();if(!/^wss?:\/\//i.test(s))s='wss://'+s;try{const u=new URL(s);return /^wss?:$/.test(u.protocol)?u.href:null}catch{return null}}
async function makeParty(name,server){
  for(let i=0;i<5;i++){
    const code=Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>EG_ALPHA[b%EG_ALPHA.length]).join('');
    // same request your Create-a-party page makes (anon key), so the existing table rules apply
    const r=await fetch(EG_SB+'/rest/v1/parties',{method:'POST',headers:{apikey:EG_KEY,Authorization:'Bearer '+EG_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({code,server,name})});
    if(r.status===409)continue;

  }

async function eagler(text){
  const m=text.match(/^@eaglercraft\b\s*(.*)$/i);if(!m)return false;

function gameRef(tok){
  tok=tok.toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,'');
  if(GAMES[tok])return {ref:tok,title:GAMES[tok].title};
  for(const [k,g] of Object.entries(GAMES))if(new URL(g.url).host===tok)return {ref:k,title:g.title};
  if(/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/[^\s:]*)?$/.test(tok))return {ref:'https://'+tok,title:tok.split('/')[0]};
  return null;
}

/* ---------- auto-create accounts (GitHub / email code) + email code sign-in ---------- */
async function ensureAccount(u,verified){
  const pv=(u.app_metadata&&u.app_metadata.provider)||'';
  if(!verified&&!['github','google'].includes(pv))return;   // email+password users still confirm by link
  await sb.from('approved_acounts').upsert({user_id:u.id,email:u.email||null});
  const {data}=await sb.from('profiles').select('id').eq('id',u.id).maybeSingle();
  if(!data){
    const m=u.user_metadata||{},base=String(m.username||m.user_name||m.preferred_username||(u.email||'user').split('@')[0]||'user').replace(/[^\w.-]/g,'').slice(0,20)||'user';
    for(let i=0;i<5;i++){const {error}=await sb.from('profiles').insert({id:u.id,username:i?base+Math.floor(Math.random()*900+100):base});if(!error||error.code!=='23505')break}
  }
}

  if(!email)return note('Enter your email first.');

  if(error)return note(error.message);
  $('cd').hidden=$('ov').hidden=false;$('cd').focus();note('Code sent. Check your email (and spam).');

$('ov').onclick=async()=>{
  const email=$('em').value.trim(),token=$('cd').value.replace(/\s/g,'');
  if(!/^\d{6,10}$/.test(token))return note('Enter the code from your email.');
  window.holdBoot=true;

    if(error)return note(error.message);
    await ensureAccount(data.user,true);   // a correct code proves the email, so the account is activated
  }finally{window.holdBoot=false}
  boot();
};
